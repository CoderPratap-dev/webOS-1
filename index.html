<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA OS</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="desktop">
      <header class="top-bar">
        <div class="os-name">NOVA OS</div>

        <div class="system-info">
          <span>Wi-Fi</span>
          <span>🔊</span>
          <span id="clock">00:00</span>
        </div>
      </header>

      <main class="workspace">
        <div class="welcome">
          <h1>NOVA OS</h1>
          <p>A simple web-based desktop</p>
        </div>

        <div class="desktop-icons">
          <div class="desktop-icon">
            <div class="icon">📁</div>
            <span>Files</span>
          </div>

          <div class="desktop-icon">
            <div class="icon">📝</div>
            <span>Notes</span>
          </div>

          <div class="desktop-icon">
            <div class="icon">⚙️</div>
            <span>Settings</span>
          </div>
        </div>
      </main>

      <footer class="taskbar">
        <button class="start-button">◉</button>

        <div class="taskbar-apps">
          <button>📁</button>
          <button>📝</button>
          <button>⚙️</button>
        </div>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
